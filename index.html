<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plain Chat Widget Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      background: #111;
      color: #eee;
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
    }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, #6b8e5a, #3b4f33);
      border: 0;
    }
    .help-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: #1b1b1b; color: #fff;
      border: 1px solid #3a3a3a; border-radius: 8px;
      padding: 7px 14px; font-size: 14px; font-weight: 600;
      cursor: pointer;
    }
    .help-btn:hover { background: #262626; }

    .help-wrap { position: relative; }
    .menu {
      display: none;
      position: absolute; right: 0; top: calc(100% + 8px);
      width: 250px; z-index: 20;
      background: #fff; color: #111;
      border: 1px solid #e3e3e3; border-radius: 10px;
      padding: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
    }
    .menu.open { display: block; }
    .menu button {
      display: flex; align-items: center; gap: 12px;
      width: 100%; padding: 10px 12px;
      background: none; border: 0; border-radius: 6px;
      font: inherit; font-size: 14px; color: #1a1a1a;
      text-align: left; cursor: pointer;
    }
    .menu button:hover { background: #f2f2f2; }
    .menu button.muted { color: #9a9a9a; }
    .menu svg {
      width: 16px; height: 16px; flex: none;
      fill: none; stroke: currentColor; stroke-width: 1.6;
      stroke-linecap: round; stroke-linejoin: round;
    }

    /* Chat panel: sits directly under the menu */
    #chat-panel {
      display: none;
      position: absolute; right: 0;
      top: calc(100% + 8px + 272px + 8px); /* under the menu */
      width: 380px; height: 560px; max-height: calc(100vh - 340px);
      z-index: 20;
      background: #fff;
      border-radius: 12px; overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,.35);
    }
    #chat-panel.open { display: block; }
    #embed { width: 100%; height: 100%; }

    main { padding: 24px 32px; }
  </style>
</head>
<body>
  <header>
    <button class="avatar" aria-label="Account"></button>
    <div class="help-wrap">
      <button class="help-btn" id="help-btn" aria-haspopup="true" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
        Help
      </button>

      <div class="menu" id="menu" role="menu">
        <button role="menuitem" onclick="window.open('https://docs.lumidb.com', '_blank', 'noopener')">
          <svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>
          Product guides
        </button>
        <button role="menuitem" onclick="window.open(SLACK_JOIN_URL, '_blank', 'noopener')">
          <svg viewBox="0 0 24 24"><path d="M17 11V5a2 2 0 0 0-4 0v6a2 2 0 0 0 4 0z"/><path d="M7 13v6a2 2 0 0 0 4 0v-6a2 2 0 0 0-4 0z"/><path d="M13 17h6a2 2 0 0 0 0-4h-6a2 2 0 0 0 0 4z"/><path d="M11 7H5a2 2 0 0 0 0 4h6a2 2 0 0 0 0-4z"/></svg>
          Join community Slack
        </button>
        <button role="menuitem" id="support-btn">
          <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
          Support channel
        </button>
        <button role="menuitem">
          <svg viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="18" cy="19" r="2"/><path d="M8 5h6a4 4 0 0 1 0 8h-4a4 4 0 0 0 0 8h6" transform="translate(0 -1) scale(1 .9)"/></svg>
          Restart tour
        </button>
        <button role="menuitem">
          <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 4 4 0 0 1-4-4 4 4 0 0 1-4-4 1 1 0 0 0-1-1z"/><path d="M8.5 11.5h.01M12 16h.01M15.5 13h.01"/></svg>
          Cookie preferences
        </button>
        <button role="menuitem">
          <svg viewBox="0 0 24 24"><path d="M4 4h16v12H8l-4 4z"/><path d="M9 9h.01M15 9h.01"/></svg>
          Leave feedback
        </button>
      </div>

      <div id="chat-panel"><div id="embed"></div></div>
    </div>
  </header>

  <main>
    <h1>Plain Chat Widget Test</h1>
    <p>Click <b>Help</b>, then <b>Support channel</b>. The Plain chat opens under the menu.</p>
  </main>

  <script>
    // Slack Connect invite to #lumidb-community-support. Expires 14 days after creation (2026-11-13) - replace when it stops working.
    var SLACK_JOIN_URL = 'https://join.slack.com/share/enQtMTI1ODk2MzExMzgxNzktNWQwNWRlNDc5YmJmMDcxYzY4NzI4ZjIzZmJkODc0MGMwNjM5ZjE4ZmE5MzFkZWNlMDZjYzRkMDM2NWQzNTE3Zg';
    var btn = document.getElementById('help-btn');
    var menu = document.getElementById('menu');
    var panel = document.getElementById('chat-panel');

    function closeAll() {
      menu.classList.remove('open');
      panel.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
    }
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = menu.classList.toggle('open');
      if (!open) panel.classList.remove('open');
      btn.setAttribute('aria-expanded', String(open));
    });
    document.getElementById('support-btn').addEventListener('click', function (e) {
      e.stopPropagation();
      panel.classList.add('open');
    });
    document.addEventListener('click', function (e) {
      if (!e.target.closest('.help-wrap')) closeAll();
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAll(); });

    // Plain widget, embedded in #embed instead of the floating bottom-right launcher
    (function(d, script) {
      script = d.createElement('script');
      script.async = false;
      script.onload = function(){
        Plain.init({
          appId: 'liveChatApp_01M7AJ65FCPPEA6KD9ZS3MJMJ6',
          hideLauncher: true,
          embedAt: d.querySelector('#embed'),
        });
      };
      script.src = 'https://chat.cdn-plain.com/index.js';
      d.getElementsByTagName('head')[0].appendChild(script);
    }(document));
  </script>
</body>
</html>
